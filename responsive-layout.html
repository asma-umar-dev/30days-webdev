<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Responsive Layout</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#f4f4f4;
    }

    /* NAVBAR */

    nav{
      background:#222;
      color:white;
      padding:15px 30px;

      display:flex;
      justify-content:space-between;
      align-items:center;

      position:sticky;
      top:0;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
    }

    .nav-links{
      display:flex;
      gap:20px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
    }

    /* HERO */

    .hero{
      height:300px;
      background:linear-gradient(to right,#007bff,#00c6ff);

      display:flex;
      justify-content:center;
      align-items:center;

      color:white;
      text-align:center;
      padding:20px;
    }

    .hero h1{
      font-size:50px;
    }

    /* CARDS */

    .container{
      padding:40px 20px;

      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);

      position:relative;
    }

    .badge{
      background:red;
      color:white;

      padding:5px 10px;
      border-radius:5px;

      position:absolute;
      top:10px;
      right:10px;
    }

    .card h2{
      margin-bottom:10px;
    }

    /* FOOTER */

    footer{
      background:#222;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:30px;
    }

    /* TABLET */

    @media(max-width:768px){

      .container{
        grid-template-columns:repeat(2,1fr);
      }

      .hero h1{
        font-size:35px;
      }

    }

    /* MOBILE */

    @media(max-width:480px){

      nav{
        flex-direction:column;
        gap:10px;
      }

      .nav-links{
        flex-direction:column;
        align-items:center;
      }

      .container{
        grid-template-columns:1fr;
      }

      .hero h1{
        font-size:28px;
      }

    }

  </style>

</head>
<body>

  <!-- NAVBAR -->

  <nav>

    <div class="logo">
      Asma Umar
    </div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Projects</a>
      <a href="#">Contact</a>
    </div>

  </nav>


  <!-- HERO -->

  <section class="hero">

    <div>
      <h1>Responsive Website</h1>
      <p>Mobile Friendly Layout Using Media Queries</p>
    </div>

  </section>


  <!-- CARDS -->

  <section class="container">

    <div class="card">

      <span class="badge">New</span>

      <h2>HTML</h2>

      <p>
        HTML is used to create webpage structure.
      </p>

    </div>

    <div class="card">

      <span class="badge">Hot</span>

      <h2>CSS</h2>

      <p>
        CSS is used for styling and responsive design.
      </p>

    </div>

    <div class="card">

      <span class="badge">JS</span>

      <h2>JavaScript</h2>

      <p>
        JavaScript adds interactivity to websites.
      </p>

    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <p>
      Made by Asma Umar
    </p>

  </footer>

</body>
</html>
