<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<!-- PRICING CARDS -->
<section class="py-20 px-8 bg-gray-100 text-center">
  <h2 class="text-4xl font-bold mb-4">Our Plans</h2>
  <p class="text-gray-500 mb-12">Choose your plan</p>
  
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl mx-auto">
    
    <!-- Basic -->
    <div class="bg-white p-8 rounded-2xl shadow-lg">
      <h3 class="text-xl font-bold mb-2">Basic</h3>
      <p class="text-4xl font-bold text-purple-600 mb-4">$9<span class="text-lg text-gray-400">/mo</span></p>
      <ul class="text-gray-500 mb-8 space-y-2">
        <li>✅ 1 Website</li>
        <li>✅ 5GB Storage</li>
        <li>❌ Custom Domain</li>
      </ul>
      <button onclick="alert('Basic Plan Selected! 🎉')" 
class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-xl transition">
Get Started
</button>
    </div>

    <!-- Pro -->
    <div class="bg-purple-600 p-8 rounded-2xl shadow-xl text-white scale-105">
      <h3 class="text-xl font-bold mb-2">Pro ⭐</h3>
      <p class="text-4xl font-bold mb-4">$29<span class="text-lg opacity-70">/mo</span></p>
      <ul class="mb-8 space-y-2 opacity-90">
        <li>✅ 5 Websites</li>
        <li>✅ 50GB Storage</li>
        <li>✅ Custom Domain</li>
      </ul>
      <button onclick="alert('Pro Plan Selected! ⭐')"
class="w-full bg-white text-purple-600 font-bold py-3 rounded-xl hover:bg-gray-100 transition">
Get Started
</button>
    </div>

    <!-- Enterprise -->
    <div class="bg-white p-8 rounded-2xl shadow-lg">
      <h3 class="text-xl font-bold mb-2">Enterprise</h3>
      <p class="text-4xl font-bold text-purple-600 mb-4">$99<span class="text-lg text-gray-400">/mo</span></p>
      <ul class="text-gray-500 mb-8 space-y-2">
        <li>✅ Unlimited Websites</li>
        <li>✅ 500GB Storage</li>
        <li>✅ Custom Domain</li>
      </ul>
      <button onclick="alert('Enterprise Plan Selected! 🚀')"
class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-xl transition">
Get Started
</button>
    </div>

  </div>
</section>
<!-- STRIPE STYLE BUTTON -->
<section class="py-20 px-8 bg-white text-center">
  <h2 class="text-4xl font-bold mb-12">Stripe Style Button</h2>
  
  <button class="bg-gradient-to-r from-purple-600 to-blue-500 hover:from-purple-800 hover:to-blue-700 text-white font-bold py-4 px-12 rounded-full shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition duration-300">
    Pay Now →
  </button>
</section>
</body>
</body>
</html>
