<!DOCTYPE html>
<html>
<body>
    <input type="text" id="cityInput" placeholder="Enter city...">
    <button onclick="getWeather()">Search</button>
    
    <div id="weatherDisplay"></div>
    <h3>Recent Searches:</h3>
    <div id="history"></div>

    <script>
       const API_KEY = "f7989229d7537d64ba84004f310dce3b"; // Apni key yahan daalein

        async function getWeather() {
            const city = document.getElementById('cityInput').value;
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // UI Update
                document.getElementById('weatherDisplay').innerHTML = `
                    <p>Temp: ${data.main.temp}°C</p>
                    <p>Humidity: ${data.main.humidity}%</p>
                `;

                // Save to localStorage
                let history = JSON.parse(localStorage.getItem('searches')) || [];
                history.unshift(city);
                history = [...new Set(history)].slice(0, 5); // Sirf top 5
                localStorage.setItem('searches', JSON.stringify(history));
                renderHistory();
            } catch(e) { alert("City not found!"); }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('searches')) || [];
            document.getElementById('history').innerHTML = history.map(city => 
                `<button onclick="document.getElementById('cityInput').value='${city}'; getWeather()">${city}</button>`
            ).join('');
        }
        renderHistory();
    </script>
</body>
</html>
